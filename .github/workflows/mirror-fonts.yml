name: Incremental licensed font mirror
on:
  workflow_dispatch:
  schedule:
    - cron: '45 4 * * 2'
permissions:
  contents: write
concurrency:
  group: font-atlas-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror next licensed batch
        run: python scripts/mirror_fonts.py --batch 12 --max-bytes 25000000
      - name: Validate JSON manifest
        run: python -m json.tool assets/fonts/manifest.json > /dev/null
      - name: Commit verified assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts
          if ! git diff --cached --quiet; then
            git commit -m "Mirror next licensed font batch"
            git pull --rebase
            git push
          fi

name: Font Atlas release verification
on:
  push:
    branches: [main]
    paths:
      - 'assets/fonts/**'
      - 'api/v1/fonts.json'
      - 'tests/hosted-fonts.test.mjs'
      - '.github/workflows/release-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

name: Sync vetted OFL font binaries
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_fonts.py'
      - '.github/workflows/sync-fonts.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download allowlisted fonts with licenses
        run: python scripts/sync_fonts.py
      - name: Commit assets to this independent repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts
          if ! git diff --cached --quiet; then
            git commit -m "Sync verified OFL font binaries"
            git push
          fi

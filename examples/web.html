<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Font Atlas SDK Demo</title><body style="font-family:Tahoma;padding:24px"><h1>پیش‌نمایش انتخاب فونت</h1><select id="font"></select><p id="preview" style="font-size:32px">سلام، این نمونه متن فارسی ۱۲۳۴۵ است.</p><div id="status"></div><script type="module">import {FontAtlas} from "../sdk/font-atlas.js";const atlas=new FontAtlas({catalogUrl:"../api/v1/fonts.json"});const status=document.querySelector("#status");try{await atlas.init();for(const f of atlas.list()){const o=document.createElement("option");o.value=f.id;o.textContent=f.name;document.querySelector("#font").append(o)}document.querySelector("#font").addEventListener("change",e=>{const f=atlas.get(e.target.value);atlas.load(f.id);document.querySelector("#preview").style.fontFamily='"'+f.cssFamily+'",sans-serif'});document.querySelector("#font").dispatchEvent(new Event("change"))}catch(e){status.textContent=e.message}</script></body></html>

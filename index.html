<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Font Atlas | کتابخانه فونت</title><style>*{box-sizing:border-box}body{margin:0;background:#090f20;color:#f0f5ff;font-family:Tahoma,Arial,sans-serif}main{max-width:1200px;margin:auto;padding:30px 18px}.hero{padding:35px;border:1px solid #334765;background:linear-gradient(130deg,#1d3156,#131c35 70%);border-radius:22px}h1{font-size:clamp(26px,4vw,48px);margin:0 0 12px}.muted{color:#a9bbd4}input,select{background:#182642;color:white;border:1px solid #354967;border-radius:11px;padding:13px;font:inherit;min-width:180px}input{flex:1}.filters{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.card{background:#121e34;border:1px solid #293c5a;border-radius:16px;padding:19px;min-height:165px;display:flex;flex-direction:column;justify-content:space-between}.card strong{font-size:21px;direction:ltr;text-align:left}.card small{color:#90a5c6}.card a{color:#8adfff;text-decoration:none;font-weight:bold}.stats{padding:14px 0;color:#b6d4ec}footer{padding:24px;color:#8da3c2}a:hover{text-decoration:underline}</style></head><body><main><header class="hero"><h1>✦ فونت اطلس</h1><p>آرشیو مستقل فونت‌های فارسی، عربی و لاتین — با لینک مستقیم به منابع اصلی</p><p class="muted">این سایت فهرست منابع فونت است و فعلاً فایل فونت را میزبانی نمی‌کند.</p></header><section class="filters"><input id="q" placeholder="جست‌وجوی نام فونت..." aria-label="جست‌وجوی فونت"><select id="group" aria-label="دسته‌بندی"><option value="">همه دسته‌ها</option><option value="فارسی">فارسی</option><option value="عربی">عربی</option><option value="لاتین">لاتین</option></select></section><div class="stats" id="stats"></div><section id="cards" class="cards"></section><footer>مجوز هر خانواده را پیش از استفاده تجاری یا بازتوزیع در صفحه منبع بررسی کنید. | <a href="https://github.com/google/fonts">Google Fonts</a></footer></main><script src="app.js"></script></body></html>
